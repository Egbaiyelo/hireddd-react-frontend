name: Run Jest Tests on Multiple Browsers

on:
  push:
    branches:
      - COIS-4000-Students   
  pull_request:
    branches:
      - COIS-4000-Students   

jobs:
  test:
    runs-on: ubuntu-latest  # Use Ubuntu runner for testing

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]  # Playwright browsers

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # Use Node.js 16+ for Playwright

      - name: Install dependencies
        run: npm install  # Install dependencies from package.json

      - name: Install Playwright Browsers
        run: npx playwright install  # Install Chromium, Firefox, WebKit

      - name: Start the local server
        run: |
          npm start &
          npx wait-on http://localhost:3000  # Wait for server to be ready

      - name: Run Jest tests on ${{ matrix.browser }}
        run: |
          export BROWSER=${{ matrix.browser }}
          npx jest --config=jest-playwright.config.js
