name: Run Jest Tests on Multiple Browsers

on:
  push:
    branches:
      - COIS-4000-Students   
  pull_request:
    branches:
      - COIS-4000-Students   

jobs:
  test:
    runs-on: ubuntu-latest  # Use Ubuntu runner for testing

    strategy:
      matrix:
        browser: [chrome, firefox, webkit]  # Test on Chrome, Firefox, and WebKit (Safari)

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  

      - name: Install dependencies
        run: npm install  # Install dependencies from package.json

      - name: Start the local server
        run: |
          # Start the server in the background (e.g., for a React app)
          npm start &

          # Wait for the server to be ready (you can adjust this depending on your app)
          npx wait-on http://localhost:3000  # Wait until the server is running

      - name: Run Jest tests on ${{ matrix.browser }}
        run: |
          # Install Puppeteer with the appropriate browser
          if [ "${{ matrix.browser }}" == "chrome" ]; then
            npx puppeteer install --chrome;  # Install Chrome
          elif [ "${{ matrix.browser }}" == "firefox" ]; then
            npx puppeteer install --firefox;  # Install Firefox
          elif [ "${{ matrix.browser }}" == "webkit" ]; then
            npx puppeteer install --webkit;  # Install WebKit (Safari)
          fi

          # Run the Jest tests for the current browser
          npx jest --testEnvironment=puppeteer --browser=${{ matrix.browser }}  # Run tests
